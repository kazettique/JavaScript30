<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HTML5 Canvas</title>
    <link rel="icon" href="https://fav.farm/🔥" />
  </head>
  <body>
    <canvas id="draw" width="800" height="800"></canvas>
    <script>
      const canvas = document.querySelector("#draw");
      const context = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      context.strokeStyle = "#BADA55";
      context.lineJoin = "round";
      context.lineCap = "round";
      context.lineWidth = 20;
      context.globalCompositeOperation = "multiply";

      let isDrawing = false;
      let lastX = 0;
      let lastY = 0;
      let hue = 0;
      let direction = true;

      function draw(event) {
        if (!isDrawing) return;
        // console.log(event);
        context.strokeStyle = `hsl(${hue}, 100%, 60%)`;
        // context.lineWidth = hue;
        context.beginPath();
        context.moveTo(lastX, lastY);
        context.lineTo(event.offsetX, event.offsetY);
        context.stroke();

        [lastX, lastY] = [event.offsetX, event.offsetY];

        hue++;

        if (hue >= 360) hue = 0;

        if (context.lineWidth >= 100 || context.lineWidth <= 1) {
          direction = !direction;
        }

        if (direction) context.lineWidth++;
        else context.lineWidth--;
      }

      canvas.addEventListener("mousemove", draw);
      canvas.addEventListener("mousedown", (event) => {
        isDrawing = true;
        [lastX, lastY] = [event.offsetX, event.offsetY];
      });
      canvas.addEventListener("mouseup", (event) => (isDrawing = false));
      canvas.addEventListener("mouseout", (event) => (isDrawing = false));
    </script>

    <style>
      html,
      body {
        margin: 0;
      }
    </style>
  </body>
</html>
